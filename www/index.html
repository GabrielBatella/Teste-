<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<title>Cidade &amp; Capital</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <div class="money"><span class="ico">💰</span><div><b id="s-cash">-</b><small id="s-delta"></small></div></div>
    <div class="pop"><span class="ico">👥</span><b id="s-pop">-</b></div>
    <div class="face" id="s-face">🙂</div>
    <div class="speed" id="speed">
      <button data-speed="0" aria-label="Pausar">⏸</button><button data-speed="1" aria-label="Jogar">▶</button><button data-speed="2" aria-label="Rápido">⏩</button>
    </div>
  </header>
  <main id="view"></main>
  <nav id="tabs">
    <button data-tab="city">🏙️<span>Cidade</span></button>
    <button data-tab="invest">💰<span>Investir</span></button>
    <button data-tab="fin">🏦<span>Banco</span></button>
    <button data-tab="news">⭐<span>Missões</span></button>
  </nav>
</div>
<div id="sheet" class="hidden"></div>
<div id="toast" class="hidden"></div>
<div id="over" class="hidden"></div>
<script src="sim.js"></script>
<script src="app.js"></script>
</body>
</html>
